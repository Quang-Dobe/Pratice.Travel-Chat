server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"googleMapsApiKey":"${GOOGLE_MAPS_API_KEY}"}';
    }

    location / {
        try_files $uri /index.html;
    }
}
